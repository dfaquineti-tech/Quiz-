<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><title>Central de Estudos</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f6fb;color:#172033}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:1050px;margin:auto;padding:18px}.top{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;border-radius:24px;padding:24px;margin-bottom:18px;box-shadow:0 10px 30px #1d4ed822}.top h1{margin:0 0 6px;font-size:30px}.top p{margin:0;opacity:.9}.card{background:#fff;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 5px 18px #17203312}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.tile{padding:22px;border-radius:18px;background:#eef4ff;border:2px solid transparent;text-align:left}.tile:hover{border-color:#2563eb}.tile b{display:block;font-size:20px;margin:8px 0}.emoji{font-size:32px}.btn{background:#2563eb;color:#fff;padding:13px 18px;border-radius:12px;font-weight:700}.btn.alt{background:#e8eef9;color:#1e3a8a}.btn.danger{background:#dc2626}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.muted{color:#667085}.hidden{display:none}.question{font-size:24px;font-weight:750;line-height:1.3;margin:18px 0}.answers{display:grid;gap:10px}.answer{padding:16px;border:2px solid #dbe3ef;background:#fff;border-radius:14px;text-align:left}.answer.correct{border-color:#16a34a;background:#ecfdf3}.answer.wrong{border-color:#dc2626;background:#fef2f2}.bar{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar>div{height:100%;background:#2563eb}.score{font-size:48px;font-weight:850;color:#2563eb}.field{display:grid;gap:6px;margin-bottom:12px}.field input,.field select,.field textarea{padding:12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}.field textarea{min-height:90px}.small{font-size:13px}.list{border-top:1px solid #e5e7eb;margin-top:15px}.item{padding:12px 0;border-bottom:1px solid #e5e7eb}.tag{display:inline-block;background:#eef2ff;color:#3730a3;padding:4px 8px;border-radius:99px;font-size:12px;margin-right:5px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:white;padding:12px 18px;border-radius:12px;display:none;z-index:5}
</style></head><body><div class="wrap"><header class="top"><h1>📚 Central de Estudos</h1><p id="welcome">Vamos estudar e aprender!</p></header><main id="app"></main></div><div id="toast" class="toast"></div><script>
const KEY='central_estudos_v2';
const seed=[
['Matemática','Fácil','Qual é o valor de 3 centenas, 2 dezenas e 5 unidades?',['325','352','235','305','320'],0],
['Matemática','Fácil','Qual número vem depois de 399?',['398','400','390','499','309'],1],
['Matemática','Fácil','Quanto é 25 + 14?',['29','39','49','31','35'],1],
['Matemática','Fácil','Qual é maior?',['145','154','105','115','145'],1],
['Matemática','Fácil','Qual é a decomposição de 472?',['400+70+2','40+70+2','400+7+2','400+72','470+2'],0],
['Matemática','Médio','Quanto é 236 + 148?',['374','384','394','364','484'],1],
['Matemática','Médio','Qual é o valor da dezena em 583?',['5','8','80','3','50'],2],
['Matemática','Médio','Complete: 210, 220, 230, __, 250',['235','240','245','260','200'],1],
['Matemática','Médio','Qual é o menor número?',['508','580','805','850','558'],0],
['Matemática','Médio','Quanto é 500 - 175?',['325','335','315','375','425'],0],
['Matemática','Difícil','Ana tinha 245 figurinhas e ganhou 128. Quantas tem agora?',['363','373','383','357','365'],1],
['Matemática','Difícil','Qual número tem 6 centenas, 4 dezenas e 9 unidades?',['649','694','469','640','609'],0],
['Matemática','Difícil','Quanto é 728 - 359?',['369','379','359','389','369'],0],
['Matemática','Difícil','Qual sequência está em ordem crescente?',['321,312,301','105,150,115','201,210,220','400,300,200','99,90,100'],2],
['Matemática','Difícil','João tem 4 caixas com 10 lápis em cada. Quantos lápis?',['14','30','40','50','100'],2],
['Português','Fácil','Qual palavra começa com a letra B?',['casa','bola','mesa','uva','rato'],1],
['Português','Fácil','Qual é o plural de “flor”?',['flors','flores','flore','florais','flor'],1],
['Português','Fácil','Qual palavra rima com “casa”?',['mesa','asa','bola','gato','pato'],1],
['Português','Fácil','Qual é uma frase?',['menino','bonito','O menino corre.','correr','azul'],2],
['Português','Fácil','Qual palavra tem 3 sílabas?',['sol','casa','boneca','flor','mar'],2],
['Português','Médio','Qual é o sinônimo de “feliz”?',['triste','alegre','bravo','cansado','lento'],1],
['Português','Médio','Qual é o antônimo de “alto”?',['grande','baixo','largo','forte','rápido'],1],
['Português','Médio','Na frase “A menina estudou”, quem estudou?',['a menina','a frase','estudou','ninguém','a escola'],0],
['Português','Médio','Qual palavra está escrita corretamente?',['caxorro','cachorro','cachoro','cachorru','cachorroo'],1],
['Português','Médio','Qual é um substantivo?',['correr','bonito','escola','rapidamente','estudar'],2],
['Português','Difícil','Qual frase está no passado?',['Eu estudo.','Eu estudarei.','Eu estudei.','Eu estudo amanhã.','Eu vou estudar.'],2],
['Português','Difícil','Qual palavra é um adjetivo?',['correr','beleza','bonito','casa','menina'],2],
['Português','Difícil','Em “O gato preto dormiu”, qual palavra caracteriza o gato?',['O','gato','preto','dormiu','o gato'],2],
['Português','Difícil','Qual opção está pontuada corretamente?',['Que dia lindo!','Que dia lindo','Que dia lindo?','Que dia lindo,','Que dia lindo.'],0],
['Português','Difícil','Qual é o plural de “pão”?',['pães','pãos','pãeses','pãezes','pãoes'],0]
];
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{name:'',pin:'1234',questions:seed.map((x,i)=>({id:i+1,subject:x[0],level:x[1],text:x[2],options:x[3],correct:x[4]})),history:[]};
function save(){localStorage.setItem(KEY,JSON.stringify(db))} function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))} function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
function home(){document.getElementById('app').innerHTML=`<section class="card"><div class="field"><label>Nome da estudante</label><input id="name" value="${esc(db.name)}" placeholder="Digite o nome"></div><button class="btn" onclick="setName()">Salvar nome</button></section><section class="card"><h2>🎯 Escolha a matéria</h2><div class="grid"><button class="tile" onclick="levels('Matemática')"><span class="emoji">🔢</span><b>Matemática</b><span class="muted">Números, contas e problemas</span></button><button class="tile" onclick="levels('Português')"><span class="emoji">📖</span><b>Português</b><span class="muted">Palavras, frases e leitura</span></button><button class="tile" onclick="levels('Todas')"><span class="emoji">🎲</span><b>Quiz misto</b><span class="muted">Mistura todas as matérias</span></button></div></section><section class="card"><h2>📊 Progresso</h2><p>Quizzes realizados: <b>${db.history.length}</b></p>${db.history.length?`<p>Último resultado: <b>${db.history.at(-1).score}/${db.history.at(-1).total} (${db.history.at(-1).pct}%)</b></p>`:''}<div class="row"><button class="btn alt" onclick="historyPage()">Ver histórico</button><button class="btn alt" onclick="parentLogin()">👨‍👩‍👧 Área do responsável</button></div></section>`;document.getElementById('welcome').textContent=db.name?`Olá, ${db.name}! Vamos estudar?`:'Vamos estudar e aprender!'}
function setName(){db.name=document.getElementById('name').value.trim();save();home();toast('Nome salvo!')}
function levels(subject){document.getElementById('app').innerHTML=`<section class="card"><button class="btn alt" onclick="home()">← Voltar</button><h2>${subject==='Todas'?'🎲 Quiz misto':esc(subject)}</h2><p class="muted">Escolha o nível</p><div class="grid">${['Fácil','Médio','Difícil'].map(l=>`<button class="tile" onclick="startQuiz('${subject}','${l}')"><span class="emoji">${l==='Fácil'?'🌱':l==='Médio'?'⭐':'🏆'}</span><b>${l}</b><span class="muted">${db.questions.filter(q=>(subject==='Todas'||q.subject===subject)&&q.level===l).length} perguntas disponíveis</span></button>`).join('')}</div></section>`}
let quiz={};function startQuiz(subject,level){let pool=db.questions.filter(q=>(subject==='Todas'||q.subject===subject)&&q.level===level);if(!pool.length)return toast('Ainda não há perguntas nesse nível.');pool=[...pool].sort(()=>Math.random()-.5).slice(0,5);quiz={pool,index:0,score:0,answered:false,subject,level};renderQuestion()}
function renderQuestion(){let q=quiz.pool[quiz.index],pct=Math.round(quiz.index/quiz.pool.length*100);document.getElementById('app').innerHTML=`<section class="card"><div class="row" style="justify-content:space-between"><b>Pergunta ${quiz.index+1} de ${quiz.pool.length}</b><span>${quiz.score} acertos</span></div><div class="bar"><div style="width:${pct}%"></div></div><div class="question">${esc(q.text)}</div><div class="answers">${q.options.map((o,i)=>`<button class="answer" id="a${i}" onclick="answer(${i})">${String.fromCharCode(65+i)}) ${esc(o)}</button>`).join('')}</div><div id="feedback" class="card hidden"></div><div class="row" style="margin-top:15px"><button class="btn alt" onclick="home()">Sair</button><button id="next" class="btn hidden" onclick="nextQ()">${quiz.index===quiz.pool.length-1?'Ver resultado':'Próxima →'}</button></div></section>`}
function answer(i){if(quiz.answered)return;quiz.answered=true;let q=quiz.pool[quiz.index];document.querySelectorAll('.answer').forEach((b,n)=>{if(n===q.correct)b.classList.add('correct');if(n===i&&i!==q.correct)b.classList.add('wrong')});if(i===q.correct){quiz.score++;document.getElementById('feedback').innerHTML='<b>🎉 Muito bem!</b><br>Resposta correta!'}else document.getElementById('feedback').innerHTML=`<b>💡 Vamos aprender!</b><br>A resposta correta é <b>${esc(q.options[q.correct])}</b>.`;document.getElementById('feedback').classList.remove('hidden');document.getElementById('next').classList.remove('hidden')}
function nextQ(){if(quiz.index<quiz.pool.length-1){quiz.index++;quiz.answered=false;renderQuestion()}else finish()}
function finish(){let pct=Math.round(quiz.score/quiz.pool.length*100);db.history.push({date:new Date().toLocaleString('pt-BR'),subject:quiz.subject,level:quiz.level,score:quiz.score,total:quiz.pool.length,pct});if(db.history.length>50)db.history.shift();save();document.getElementById('app').innerHTML=`<section class="card" style="text-align:center"><div class="emoji">🏆</div><h2>Quiz concluído!</h2><div class="score">${pct}%</div><p>Você acertou <b>${quiz.score}</b> de <b>${quiz.pool.length}</b> perguntas.</p><p>${pct>=80?'Excelente! 🌟':pct>=60?'Muito bem! Continue praticando! 💪':'Vamos tentar novamente. Você consegue! 🚀'}</p><div class="row" style="justify-content:center"><button class="btn" onclick="levels('${quiz.subject}')">Jogar novamente</button><button class="btn alt" onclick="home()">Início</button></div></section>`}
function historyPage(){document.getElementById('app').innerHTML=`<section class="card"><button class="btn alt" onclick="home()">← Voltar</button><h2>📊 Histórico</h2><div class="list">${db.history.length?db.history.slice().reverse().map(h=>`<div class="item"><span class="tag">${esc(h.subject)}</span><span class="tag">${esc(h.level)}</span><b>${h.score}/${h.total} — ${h.pct}%</b><div class="small muted">${esc(h.date)}</div></div>`).join(''):'<p class="muted">Ainda não há resultados.</p>'}</div><button class="btn danger" style="margin-top:15px" onclick="resetHistory()">Apagar histórico</button></section>`}
function resetHistory(){if(confirm('Apagar todo o histórico?')){db.history=[];save();historyPage()}}
function parentLogin(){document.getElementById('app').innerHTML=`<section class="card"><button class="btn alt" onclick="home()">← Voltar</button><h2>🔐 Área do responsável</h2><p class="muted">Digite o PIN para administrar as perguntas.</p><div class="field"><label>PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="8"></div><button class="btn" onclick="checkPin()">Entrar</button><p class="small muted">PIN inicial: 1234. Você poderá alterá-lo depois.</p></section>`}
function checkPin(){if(document.getElementById('pin').value===db.pin)parentArea();else toast('PIN incorreto')}
function parentArea(){document.getElementById('app').innerHTML=`<section class="card"><div class="row"><button class="btn alt" onclick="home()">← Início</button><button class="btn alt" onclick="changePin()">Alterar PIN</button><button class="btn alt" onclick="exportData()">⬇ Backup</button><label class="btn alt">⬆ Restaurar<input type="file" accept="application/json" onchange="importData(event)" hidden></label></div><h2>👨‍👩‍👧 Banco de perguntas</h2><p class="muted">Total: ${db.questions.length} perguntas</p><button class="btn" onclick="editor()">＋ Nova pergunta</button><div class="list">${db.questions.map(q=>`<div class="item"><span class="tag">${esc(q.subject)}</span><span class="tag">${esc(q.level)}</span><b>${esc(q.text)}</b><div class="row" style="margin-top:8px"><button class="btn alt small" onclick="editor(${q.id})">Editar</button><button class="btn danger small" onclick="delQ(${q.id})">Excluir</button></div></div>`).join('')}</div></section>`}
function editor(id){let q=id?db.questions.find(x=>x.id===id):{subject:'Matemática',level:'Fácil',text:'',options:['','','','',''],correct:0};document.getElementById('app').innerHTML=`<section class="card"><button class="btn alt" onclick="parentArea()">← Voltar</button><h2>${id?'✏️ Editar':'➕ Nova'} pergunta</h2><div class="grid"><div class="field"><label>Matéria</label><select id="subject"><option ${q.subject==='Matemática'?'selected':''}>Matemática</option><option ${q.subject==='Português'?'selected':''}>Português</option><option ${q.subject==='Ciências'?'selected':''}>Ciências</option></select></div><div class="field"><label>Nível</label><select id="level"><option>Fácil</option><option ${q.level==='Médio'?'selected':''}>Médio</option><option ${q.level==='Difícil'?'selected':''}>Difícil</option></select></div></div><div class="field"><label>Pergunta</label><textarea id="text">${esc(q.text)}</textarea></div>${q.options.map((o,i)=>`<div class="field"><label>Alternativa ${String.fromCharCode(65+i)}</label><input id="o${i}" value="${esc(o)}"></div>`).join('')}<div class="field"><label>Resposta correta</label><select id="correct">${q.options.map((o,i)=>`<option value="${i}" ${q.correct===i?'selected':''}>Alternativa ${String.fromCharCode(65+i)}</option>`).join('')}</select></div><button class="btn" onclick="saveQ(${id||0})">Salvar pergunta</button></section>`}
function saveQ(id){let q={id:id||Date.now(),subject:document.getElementById('subject').value,level:document.getElementById('level').value,text:document.getElementById('text').value.trim(),options:[0,1,2,3,4].map(i=>document.getElementById('o'+i).value.trim()),correct:+document.getElementById('correct').value};if(!q.text||q.options.some(x=>!x)){return toast('Preencha a pergunta e as 5 alternativas.')}if(id){let i=db.questions.findIndex(x=>x.id===id);db.questions[i]=q}else db.questions.push(q);save();parentArea();toast('Pergunta salva!')}
function delQ(id){if(confirm('Excluir esta pergunta?')){db.questions=db.questions.filter(q=>q.id!==id);save();parentArea();}}
function changePin(){let p=prompt('Digite o novo PIN:');if(p&&/^\d{4,8}$/.test(p)){db.pin=p;save();toast('PIN alterado!')}else if(p)toast('Use de 4 a 8 números.')}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-central-estudos.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.questions||!Array.isArray(x.questions))throw 0;if(confirm('Restaurar este backup? Isso substituirá as perguntas e o histórico atuais.')){db=x;save();parentArea()}}catch{toast('Backup inválido.')}};r.readAsText(f)}
home();
</script></body></html>
