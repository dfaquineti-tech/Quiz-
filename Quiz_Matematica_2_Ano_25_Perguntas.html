<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Quiz de Matemática — 2º Ano</title>
<style>
:root {
  --bg:#f4f7fb; --card:#fff; --primary:#2f6fed; --primary2:#174ea6;
  --text:#1d2939; --muted:#667085; --ok:#16803c; --bad:#c62828;
}
* { box-sizing:border-box; }
body { margin:0; font-family:Arial,Helvetica,sans-serif; background:var(--bg); color:var(--text); }
header { background:linear-gradient(135deg,var(--primary),var(--primary2)); color:#fff; padding:20px; text-align:center; }
h1 { margin:0 0 6px; font-size:clamp(24px,5vw,36px); }
header p { margin:0; font-size:16px; opacity:.92; }
main { max-width:900px; margin:auto; padding:18px; }
.top { display:flex; justify-content:space-between; gap:10px; align-items:center; margin-bottom:12px; }
.progress { height:10px; background:#dbe4f2; border-radius:20px; overflow:hidden; flex:1; }
.progress i { display:block; height:100%; width:0%; background:var(--primary); transition:.25s; }
.counter { font-weight:700; white-space:nowrap; }
.card { background:var(--card); border-radius:22px; padding:24px; box-shadow:0 8px 30px rgba(0,0,0,.08); }
.question { font-size:clamp(21px,4vw,30px); font-weight:700; line-height:1.3; margin:4px 0 22px; }
.options { display:grid; grid-template-columns:1fr; gap:12px; }
.option { border:2px solid #d7deea; background:#fff; border-radius:16px; padding:17px; font-size:clamp(18px,3.5vw,23px); text-align:left; cursor:pointer; min-height:62px; transition:.15s; }
.option:active { transform:scale(.99); }
.option:hover { border-color:var(--primary); background:#f7faff; }
.option.selected { border-color:var(--primary); background:#eaf1ff; }
.option.correct { border-color:var(--ok); background:#eaf8ef; }
.option.wrong { border-color:var(--bad); background:#ffeded; }
.feedback { margin-top:18px; padding:15px; border-radius:14px; font-size:17px; display:none; }
.feedback.show { display:block; }
.nav { display:flex; justify-content:space-between; gap:12px; margin-top:20px; }
button { border:0; border-radius:14px; padding:15px 22px; font-size:18px; font-weight:700; cursor:pointer; }
#prev { background:#e8edf5; color:#344054; }
#next { background:var(--primary); color:#fff; flex:1; max-width:280px; }
button:disabled { opacity:.45; cursor:not-allowed; }
#result { display:none; text-align:center; }
.score { font-size:54px; font-weight:800; color:var(--primary); }
.badge { display:inline-block; padding:9px 14px; border-radius:30px; background:#eaf1ff; font-weight:700; margin:10px; }
.restart { background:var(--primary); color:#fff; }
.small { color:var(--muted); font-size:14px; margin-top:12px; }
@media(min-width:650px) { .options { grid-template-columns:1fr 1fr; } .option:last-child { grid-column:1 / -1; } }
</style>
</head>
<body>
<header>
  <h1>Quiz de Matemática</h1>
  <p>2º ano • Números, decomposição e adição</p>
</header>
<main>
  <section id="quiz">
    <div class="top">
      <div class="progress"><i id="bar"></i></div>
      <div class="counter" id="counter">1 / 25</div>
    </div>
    <div class="card">
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="nav">
        <button id="prev" onclick="prevQ()">Anterior</button>
        <button id="next" onclick="nextQ()">Responder</button>
      </div>
    </div>
    <div class="small">Escolha uma resposta e toque em “Responder”.</div>
  </section>

  <section id="result" class="card">
    <h2>Quiz concluído!</h2>
    <div class="score" id="score">0/25</div>
    <div class="badge" id="percent">0%</div>
    <p id="message"></p>
    <button class="restart" onclick="restart()">Fazer novamente</button>
  </section>
</main>

<script>
const questions = [{"id": 1, "q": "Quanto é 26 + 35?", "options": ["51", "61", "71", "60", "65"], "answer": "61"}, {"id": 2, "q": "Quanto é 56 + 15?", "options": ["61", "71", "70", "72", "81"], "answer": "71"}, {"id": 3, "q": "Quanto é 16 + 17?", "options": ["23", "31", "33", "34", "43"], "answer": "33"}, {"id": 4, "q": "Quanto é 57 + 24?", "options": ["71", "81", "91", "89", "93"], "answer": "81"}, {"id": 5, "q": "Quanto é 94 + 28?", "options": ["112", "122", "132", "118", "124"], "answer": "122"}, {"id": 6, "q": "Quanto é 118 + 23?", "options": ["131", "141", "151", "139", "145"], "answer": "141"}, {"id": 7, "q": "Quanto é 39 + 33?", "options": ["62", "72", "82", "73", "70"], "answer": "72"}, {"id": 8, "q": "Quanto é 48 + 32?", "options": ["70", "80", "90", "78", "82"], "answer": "80"}, {"id": 9, "q": "Quanto é 16 + 85?", "options": ["91", "101", "111", "99", "105"], "answer": "101"}, {"id": 10, "q": "Quanto é 74 + 53?", "options": ["127", "125", "126", "128", "129"], "answer": "127"}, {"id": 11, "q": "Quanto é 132 + 58?", "options": ["180", "190", "200", "188", "198"], "answer": "190"}, {"id": 12, "q": "Quanto é 106 + 78?", "options": ["174", "184", "194", "176", "180"], "answer": "184"}, {"id": 13, "q": "Quanto é 143 + 84?", "options": ["227", "225", "226", "228", "229"], "answer": "227"}, {"id": 14, "q": "Quanto é 13 + 69?", "options": ["72", "82", "92", "80", "78"], "answer": "82"}, {"id": 15, "q": "Quanto é 33 + 19?", "options": ["42", "52", "62", "51", "53"], "answer": "52"}, {"id": 16, "q": "Quanto é 125 + 15?", "options": ["130", "140", "150", "135", "145"], "answer": "140"}, {"id": 17, "q": "Quanto é 137 + 58?", "options": ["195", "193", "194", "196", "197"], "answer": "195"}, {"id": 18, "q": "Quanto é 67 + 25?", "options": ["82", "92", "102", "90", "95"], "answer": "92"}, {"id": 19, "q": "Quanto é 24 + 35?", "options": ["49", "59", "69", "50", "60"], "answer": "59"}, {"id": 20, "q": "Quanto é 118 + 64?", "options": ["172", "182", "192", "180", "178"], "answer": "182"}, {"id": 21, "q": "Na casa de Lara havia 44 livros e ela colocou mais 27 na estante. Quantos livros ficaram na estante?", "options": ["61", "71", "81", "70", "72"], "answer": "71"}, {"id": 22, "q": "Uma escola tinha 75 estudantes e 19 professores em um evento. Quantas pessoas participaram?", "options": ["84", "94", "104", "96", "90"], "answer": "94"}, {"id": 23, "q": "Uma festa tinha 56 tampinhas no primeiro dia e 43 no segundo. Quantas tampinhas foram arrecadadas?", "options": ["89", "99", "109", "93", "103"], "answer": "99"}, {"id": 24, "q": "Melina usou 18 litros de água gelada e 75 litros de água em temperatura ambiente. Quantos litros de água ela usou ao todo?", "options": ["83", "93", "103", "95", "90"], "answer": "93"}, {"id": 25, "q": "Uma biblioteca recebeu 54 livros em uma semana e 48 na outra. Quantos livros recebeu ao todo?", "options": ["92", "102", "112", "98", "104"], "answer": "102"}];
let current = 0;
let selected = Array(questions.length).fill(null);
let checked = Array(questions.length).fill(false);
let score = 0;

function render() {
  const item = questions[current];
  document.getElementById('counter').textContent = `${current+1} / ${questions.length}`;
  document.getElementById('bar').style.width = `${((current+1)/questions.length)*100}%`;
  document.getElementById('question').textContent = item.q;
  const box = document.getElementById('options');
  box.innerHTML = '';
  item.options.forEach((opt, idx) => {
    const b = document.createElement('button');
    b.className = 'option';
    b.textContent = String.fromCharCode(65+idx) + ') ' + opt;
    if (selected[current] === opt) b.classList.add('selected');
    if (checked[current]) {
      if (opt === item.answer) b.classList.add('correct');
      else if (selected[current] === opt) b.classList.add('wrong');
    }
    b.disabled = checked[current];
    b.onclick = () => selectOption(opt);
    box.appendChild(b);
  });
  const fb = document.getElementById('feedback');
  if (checked[current]) {
    const ok = selected[current] === item.answer;
    fb.className = 'feedback show';
    fb.style.background = ok ? '#eaf8ef' : '#ffeded';
    fb.style.color = ok ? '#11652f' : '#8e1c1c';
    fb.textContent = ok ? 'Muito bem! Você acertou.' : 'Quase! A resposta correta é ' + item.answer + '.';
  } else {
    fb.className = 'feedback';
    fb.textContent = '';
  }
  document.getElementById('prev').disabled = current === 0;
  document.getElementById('next').textContent = checked[current] ? (current === questions.length-1 ? 'Ver resultado' : 'Próxima') : 'Responder';
}

function selectOption(opt) {
  if (checked[current]) return;
  selected[current] = opt;
  render();
}

function nextQ() {
  if (!checked[current]) {
    if (selected[current] === null) {
      alert('Escolha uma opção antes de responder.');
      return;
    }
    checked[current] = true;
    if (selected[current] === questions[current].answer) score++;
    render();
    return;
  }
  if (current < questions.length-1) {
    current++;
    render();
  } else {
    showResult();
  }
}

function prevQ() {
  if (current > 0) { current--; render(); }
}

function showResult() {
  document.getElementById('quiz').style.display='none';
  document.getElementById('result').style.display='block';
  const pct = Math.round(score/questions.length*100);
  document.getElementById('score').textContent = `${score}/${questions.length}`;
  document.getElementById('percent').textContent = pct + '% de acertos';
  document.getElementById('message').textContent =
    pct >= 90 ? 'Excelente! Você dominou muito bem a matéria.' :
    pct >= 70 ? 'Muito bom! Continue praticando para ficar ainda melhor.' :
    pct >= 50 ? 'Bom trabalho! Mais um pouco de prática vai ajudar.' :
    'Vamos praticar mais um pouco. Você consegue!';
}

function restart() {
  current=0; selected=Array(questions.length).fill(null);
  checked=Array(questions.length).fill(false); score=0;
  document.getElementById('quiz').style.display='block';
  document.getElementById('result').style.display='none';
  render();
}
render();
</script>
</body>
</html>
